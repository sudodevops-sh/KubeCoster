# ---------------------------------------
# Project Metadata
# ---------------------------------------
[project]
name = "kubecoster"
version = "0.1.0"
description = "Kubernetes operator for monitoring and notifying costly resources"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["kubernetes", "operator", "cost", "finops", "kopf"]

# Author Information
authors = [
    { name = "nilesh.chudasama", email = "nileshchudasama998@gmail.com" }
]

# ---------------------------------------
# Runtime Dependencies (production only)
# ---------------------------------------
dependencies = [
    "kubernetes>=29.0.0",
    "kopf>=1.37.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "black",
    "pylint",
    "pytest",
    "flake8",
    "flake8-pyproject"
]

# ---------------------------------------
# Optional / Dev Dependencies
# (install with: uv sync --group dev)
# ---------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pylint>=3.2.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.3",
    "taskipy>=1.13.0",
]

# ---------------------------------------
# Setuptools Configuration
# [tool.*] — correct TOML table key
# ---------------------------------------
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["cmd", "internal"]

# ---------------------------------------
# Pylint Configuration
# ---------------------------------------
[tool.pylint.main]
ignore-paths = ["__init__.py"]

# ---------------------------------------
# Build System Configuration
# ---------------------------------------
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------
# UV Configuration
# ---------------------------------------
[tool.uv]
# pyyaml ships wheels; prevent uv from building from source
no-build-package = ["pyyaml"]

# ---------------------------------------
# Taskipy: Project Task Runners
# Run with: task lint
# 1. Checks formatting using black
# 2. Runs pylint and ensures minimum score of 7
# 3. Runs flake8 with custom settings
# ---------------------------------------
[tool.taskipy.tasks]
lint = """
black cmd/ internal/ --check -v --line-length=120 --diff --exclude '__init__.py' && \
pylint cmd/ internal/ --fail-under=7 --disable=all -f parseable && \
flake8 cmd/ internal/ -v --max-line-length 120 --ignore=E,F,W,C,N --exclude=__init__.py
"""